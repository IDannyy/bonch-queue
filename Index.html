<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Очередь — ИСТ-321</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap');

  :root {
    --black: #0a0a0a;
    --dark: #111111;
    --card: #161616;
    --border: #222222;
    --green: #4ade80;
    --green-dim: #166534;
    --green-glow: rgba(74,222,128,0.15);
    --white: #f0f0f0;
    --muted: #666;
    --danger: #ef4444;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: var(--black);
    color: var(--white);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HEADER */
  .header {
    background: var(--dark);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px 12px;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-wrap {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: var(--green);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
  }

  .logo-wrap img {
    width: 32px;
    height: 32px;
    object-fit: contain;
  }

  .logo-text {
    flex: 1;
  }

  .logo-text .title {
    font-family: 'Oswald', sans-serif;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: var(--white);
    line-height: 1;
  }

  .logo-text .subtitle {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.03em;
    margin-top: 2px;
  }

  .group-badge {
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--green);
    background: var(--green-glow);
    border: 1px solid var(--green-dim);
    padding: 4px 10px;
    border-radius: 6px;
  }

  /* SUBJECTS */
  .subjects {
    padding: 12px 16px 0;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .subjects::-webkit-scrollbar { display: none; }

  .subj-tab {
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.06em;
    white-space: nowrap;
    padding: 7px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .subj-tab.active {
    background: var(--green);
    border-color: var(--green);
    color: var(--black);
  }

  .subj-tab:not(.active):hover {
    border-color: var(--green-dim);
    color: var(--white);
  }

  /* QUEUE PANEL */
  .panel {
    padding: 16px;
  }

  .subject-full {
    font-family: 'Oswald', sans-serif;
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--white);
    margin-bottom: 4px;
    line-height: 1.2;
  }

  .queue-meta {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--green);
    display: inline-block;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* QUEUE LIST */
  .queue-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .queue-empty {
    text-align: center;
    padding: 40px 0;
    color: var(--muted);
    font-size: 14px;
  }

  .queue-empty .icon {
    font-size: 36px;
    display: block;
    margin-bottom: 12px;
    opacity: 0.5;
  }

  .person-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: all 0.2s;
    animation: slideIn 0.25s ease forwards;
    opacity: 0;
    transform: translateY(8px);
  }

  @keyframes slideIn {
    to { opacity: 1; transform: translateY(0); }
  }

  .person-card:nth-child(1) { animation-delay: 0.03s; }
  .person-card:nth-child(2) { animation-delay: 0.08s; }
  .person-card:nth-child(3) { animation-delay: 0.13s; }
  .person-card:nth-child(4) { animation-delay: 0.18s; }
  .person-card:nth-child(5) { animation-delay: 0.23s; }
  .person-card:nth-child(n+6) { animation-delay: 0.28s; }

  .person-card.is-me {
    border-color: var(--green-dim);
    background: linear-gradient(135deg, #0f2018 0%, var(--card) 100%);
  }

  .pos-badge {
    font-family: 'Oswald', sans-serif;
    font-size: 15px;
    font-weight: 700;
    width: 32px;
    text-align: center;
    flex-shrink: 0;
    color: var(--muted);
  }

  .pos-badge.gold { color: #fbbf24; }
  .pos-badge.silver { color: #94a3b8; }
  .pos-badge.bronze { color: #b45309; }

  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--green-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Oswald', sans-serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--green);
    flex-shrink: 0;
    border: 1px solid var(--green-dim);
  }

  .person-info {
    flex: 1;
    min-width: 0;
  }

  .person-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--white);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .person-me-tag {
    font-size: 10px;
    background: var(--green-glow);
    color: var(--green);
    border: 1px solid var(--green-dim);
    border-radius: 4px;
    padding: 1px 5px;
    margin-left: 6px;
    font-weight: 600;
    letter-spacing: 0.05em;
    vertical-align: middle;
  }

  .person-sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  .tg-link {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--dark);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.18s;
    text-decoration: none;
    color: var(--muted);
  }

  .tg-link:hover, .tg-link:active {
    border-color: #229ED9;
    color: #229ED9;
    background: rgba(34,158,217,0.1);
  }

  /* ACTION BUTTONS */
  .actions {
    padding: 0 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .btn {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-family: 'Oswald', sans-serif;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: all 0.18s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-primary {
    background: var(--green);
    color: var(--black);
  }
  .btn-primary:active { background: #22c55e; transform: scale(0.98); }

  .btn-secondary {
    background: var(--card);
    color: var(--white);
    border: 1px solid var(--border);
  }
  .btn-secondary:active { background: #1f1f1f; transform: scale(0.98); }

  .btn-danger {
    background: transparent;
    color: var(--danger);
    border: 1px solid #3f1111;
  }
  .btn-danger:active { background: rgba(239,68,68,0.05); transform: scale(0.98); }

  .btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* DIVIDER */
  .divider {
    height: 1px;
    background: var(--border);
    margin: 4px 16px 12px;
  }

  /* LOADING */
  .loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 200px;
    gap: 12px;
    color: var(--muted);
    font-size: 13px;
  }

  .spinner {
    width: 28px;
    height: 28px;
    border: 2px solid var(--border);
    border-top-color: var(--green);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--white);
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 13px;
    opacity: 0;
    transition: all 0.25s;
    pointer-events: none;
    z-index: 999;
    white-space: nowrap;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* BOTTOM SAFE AREA */
  .safe-bottom { height: 20px; }
</style>
</head>
<body>

<div class="header">
  <div class="logo-wrap">
    <!-- СПбГУТ логотип SVG (схематичный) -->
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
      <rect x="2" y="8" width="24" height="3" rx="1.5" fill="#0a0a0a"/>
      <rect x="2" y="13" width="24" height="3" rx="1.5" fill="#0a0a0a"/>
      <rect x="2" y="18" width="24" height="3" rx="1.5" fill="#0a0a0a"/>
      <rect x="11" y="3" width="3" height="22" rx="1.5" fill="#0a0a0a"/>
      <rect x="17" y="3" width="3" height="22" rx="1.5" fill="#0a0a0a"/>
    </svg>
  </div>
  <div class="logo-text">
    <div class="title">СПбГУТ</div>
    <div class="subtitle">Очередь на сдачу</div>
  </div>
  <div class="group-badge">ИСТ-321</div>
</div>

<div class="subjects" id="subjectTabs"></div>

<div class="panel" id="mainPanel">
  <div class="loading"><div class="spinner"></div><span>Загрузка...</span></div>
</div>

<div class="actions" id="actionButtons"></div>

<div class="safe-bottom"></div>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const SUBJECTS = [
  "Методы и средства проектирования ИС и Т",
  "Технологии Front-end разработки веб-приложений",
  "Современные операционные системы",
  "Администрирование баз данных"
];
const SUBJECTS_SHORT = ["МиСПИСиТ", "Front-end", "СОС", "АБД"];

let currentIdx = 0;
let queues = {};
let myUserId = tg.initDataUnsafe?.user?.id || null;
let myUsername = tg.initDataUnsafe?.user?.username || null;

// Получаем данные от бота через botAPI
async function fetchQueues() {
  try {
    const params = new URLSearchParams(window.location.search);
    const data = params.get('data');
    if (data) {
      queues = JSON.parse(decodeURIComponent(data));
    }
  } catch(e) {}
  renderAll();
}

function getInitials(name) {
  return name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
}

function posClass(i) {
  return ['gold','silver','bronze'][i] || '';
}

function posMedal(i) {
  return ['🥇','🥈','🥉'][i] || `${i+1}`;
}

function renderTabs() {
  const wrap = document.getElementById('subjectTabs');
  wrap.innerHTML = SUBJECTS_SHORT.map((s, i) =>
    `<button class="subj-tab${i === currentIdx ? ' active' : ''}" onclick="selectSubject(${i})">${s}</button>`
  ).join('');
}

function renderQueue() {
  const panel = document.getElementById('mainPanel');
  const subject = SUBJECTS[currentIdx];
  const q = queues[currentIdx] || [];
  const myPos = q.findIndex(u => u.id == myUserId);

  let listHtml = '';
  if (q.length === 0) {
    listHtml = `<div class="queue-empty"><span class="icon">📋</span>Очередь пуста.<br>Будь первым!</div>`;
  } else {
    listHtml = '<div class="queue-list">' + q.map((u, i) => {
      const isMe = u.id == myUserId;
      const initials = getInitials(u.name);
      const tgBtn = u.username
        ? `<a class="tg-link" href="https://t.me/${u.username}" onclick="openTg('${u.username}',event)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.562 8.248l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.447 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.12l-6.871 4.326-2.962-.924c-.643-.204-.657-.643.136-.953l11.57-4.461c.537-.194 1.006.131.833.941z"/>
            </svg>
          </a>`
        : `<div class="tg-link" style="opacity:0.2;cursor:default">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.562 8.248l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.447 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.12l-6.871 4.326-2.962-.924c-.643-.204-.657-.643.136-.953l11.57-4.461c.537-.194 1.006.131.833.941z"/>
            </svg>
          </div>`;
      return `<div class="person-card${isMe ? ' is-me' : ''}" style="animation-delay:${0.03 + i*0.05}s">
        <div class="pos-badge ${posClass(i)}">${posMedal(i)}</div>
        <div class="avatar">${initials}</div>
        <div class="person-info">
          <div class="person-name">${u.name}${isMe ? '<span class="person-me-tag">ТЫ</span>' : ''}</div>
          <div class="person-sub">${u.username ? '@'+u.username : 'без username'}</div>
        </div>
        ${tgBtn}
      </div>`;
    }).join('') + '</div>';
  }

  const count = q.length;
  panel.innerHTML = `
    <div class="subject-full">${subject}</div>
    <div class="queue-meta">
      <span class="dot"></span>
      ${count === 0 ? 'Очередь пуста' : `В очереди: ${count} чел.`}
      ${myPos >= 0 ? ` · Ты на позиции ${myPos+1}` : ''}
    </div>
    ${listHtml}
  `;
}

function renderActions() {
  const wrap = document.getElementById('actionButtons');
  const q = queues[currentIdx] || [];
  const myPos = q.findIndex(u => u.id == myUserId);
  const inQueue = myPos >= 0;

  let btns = '';
  if (!inQueue) {
    btns += `<button class="btn btn-primary" onclick="doAction('join')">✅ Встать в очередь</button>`;
  } else {
    const canSkip = myPos + 1 < q.length;
    btns += `<button class="btn btn-secondary" onclick="doAction('skip')" ${!canSkip ? 'disabled' : ''}>⏭ Пропустить ход</button>`;
    btns += `<button class="btn btn-danger" onclick="doAction('leave')">❌ Выйти из очереди</button>`;
  }
  btns += `<div class="divider"></div>`;
  btns += `<button class="btn btn-secondary" onclick="doRefresh()">🔄 Обновить</button>`;

  wrap.innerHTML = btns;
}

function renderAll() {
  renderTabs();
  renderQueue();
  renderActions();
}

function selectSubject(i) {
  currentIdx = i;
  renderAll();
  // скролл к выбранному табу
  const tabs = document.querySelectorAll('.subj-tab');
  tabs[i]?.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
}

function doAction(action) {
  tg.sendData(JSON.stringify({ action, idx: currentIdx }));
}

function doRefresh() {
  tg.sendData(JSON.stringify({ action: 'refresh', idx: currentIdx }));
}

function openTg(username, e) {
  e.preventDefault();
  tg.openLink(`https://t.me/${username}`);
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

// Инициализация
fetchQueues();
</script>
</body>
</html>
